    <style>
        :root { --gold: #FFD700; --neon: #ff00e6; --bg: #020202; }
        body { background: var(--bg); color: #fff; font-family: 'Rajdhani', sans-serif; background-image: radial-gradient(circle at 50% -20%, #1a1a1a, #020202); margin: 0; padding-bottom: 80px; overflow-x: hidden; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .glass-3d { background: rgba(255,255,255,0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; transition: 0.4s; }
        
        /* AVISO DE RED INCORRECTA */
        #network-alert { position: fixed; top: 0; width: 100%; background: #ff4444; color: #fff; text-align: center; padding: 10px; font-weight: bold; z-index: 1000000; display: none; cursor: pointer; font-family: 'Orbitron'; font-size: 12px; }
        
        .btn-float { width: 55px; height: 55px; border-radius: 50%; background: var(--gold); color: #000; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; border: none; box-shadow: 0 0 20px rgba(255,215,0,0.4); }
        .floating-actions { position: fixed; right: 25px; bottom: 100px; display: flex; flex-direction: column; gap: 15px; z-index: 100000; }
        .carousel-track { display: flex; gap: 20px; animation: scroll-infinite 30s linear infinite; width: max-content; }
        @keyframes scroll-infinite { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .footer-status-bar { position: fixed; bottom: 0; width: 100%; height: 45px; background: rgba(0,0,0,0.98); border-top: 1px solid #222; display: flex; align-items: center; padding: 0 25px; z-index: 999999; }
        .ticker-item { padding: 0 40px; font-size: 11px; font-weight: bold; font-family: 'Orbitron'; color: #666; white-space: nowrap; }
        .animate-scroll { display: flex; animation: scroll-text 40s linear infinite; width: max-content; }
        @keyframes scroll-text { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .up { color: #00ff88; } .down { color: #ff4444; }
        input { background: rgba(0,0,0,0.6) !important; border: 1px solid rgba(255,255,255,0.1) !important; color: var(--gold) !important; padding: 14px !important; border-radius: 15px !important; outline: none; width: 100%; }

<body>

<!-- ALERTA DE RED -->
<div id="network-alert" onclick="switchNetwork()">⚠️ RED INCORRECTA: HAZ CLIC AQUÍ PARA CAMBIAR A POLYGON</div>

<div class="floating-actions">
    <button class="btn-float" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">⬆️</button>
    <button class="btn-float" style="background:#ff00e6; color:#fff;" onclick="connect()">🔌</button>
    <button class="btn-float" style="background:#00d2ff;" onclick="syncData()">🔄</button>
</div>

<div class="p-6 md:p-12 max-w-7xl mx-auto space-y-12">
    <header class="flex flex-col md:flex-row justify-between items-center">
        <div>
            <h1 class="orbitron text-5xl font-bold text-yellow-400 tracking-tighter uppercase">DOA MONSTER</h1>
            <p class="text-[10px] tracking-[0.5em] text-gray-500 uppercase font-bold mt-2">Elite Automated Terminal</p>
        </div>
        <div class="glass-3d px-10 py-5 flex items-center gap-8">
            <div class="text-right">
                <p id="walletAddr" class="orbitron text-[10px] text-yellow-600 font-bold">DISCONNECTED</p>
                <p id="userBalance" class="text-2xl font-bold text-white">0.00 POL</p>
            </div>
            <button onclick="connect()" class="bg-yellow-400 text-black px-8 py-3 rounded-xl font-bold orbitron text-xs hover:scale-105 transition-all">CONECTAR</button>
        </div>
    </header>

    <div class="glass-3d p-6 h-[350px] relative overflow-hidden">
        <div id="chart-container" class="w-full h-full"></div>
    </div>

    <div class="carousel-container overflow-hidden">
        <div id="nftCarousel" class="carousel-track"></div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- LISTAR NFT -->
        <div class="glass-3d p-8 border-t-2 border-yellow-500/30">
            <h3 class="orbitron text-sm font-bold text-yellow-500 mb-8 uppercase">🚀 Publicar Activo</h3>
            <div class="space-y-4">
                <input type="text" id="nftAddr" placeholder="Dirección Contrato 0x...">
                <div class="flex gap-3">
                    <input type="number" id="tokenId" placeholder="ID">
                    <input type="text" id="price" placeholder="Precio POL">
                </div>
                <button id="btnList" onclick="listNFTAction()" class="w-full py-4 bg-yellow-500 text-black font-bold orbitron text-xs rounded-xl uppercase">Publicar Ahora</button>
            </div>
        </div>

        <!-- VIP PRO -->
        <div class="glass-3d p-8 border-t-2 border-pink-500/30">
            <h3 class="orbitron text-sm font-bold text-pink-500 mb-4 uppercase">💎 VIP Pro</h3>
            <p class="text-[11px] text-gray-400 mb-8">Activa comisiones 0% en la red Polygon.</p>
            <div class="bg-black/50 p-5 rounded-2xl mb-8 flex justify-between items-center border border-white/5">
                <span class="text-xl font-bold text-yellow-400">0.1 POL</span>
            </div>
            <button id="btnVip" onclick="buyVipAction()" class="w-full py-4 bg-pink-600 text-white font-bold orbitron text-xs rounded-xl shadow-lg">ACTIVAR VIP</button>
        </div>
    </div>
</div>

<div class="footer-status-bar">
    <div id="master-ticker" class="flex items-center"></div>
</div>

<script>
    const MAIN_CONTRACT = "0x4C1372aB4197116d34e7e43489A8c4412FD74694";
    const POLYGON_CHAIN_ID = "0x89"; // 137 en Decimal
    const ABI = [
        "function listNFT(address nft, uint256 tokenId, uint256 price, address token) external payable",
        "function listingFee() public view returns (uint256)"
    ];
    let provider, signer, contract;

    // 1. DETECTOR DE RED Y CAMBIO AUTOMÁTICO
    async function checkNetwork() {
        if (window.ethereum) {
            const chainId = await window.ethereum.request({ method: 'eth_chainId' });
            if (chainId !== POLYGON_CHAIN_ID) {
                document.getElementById('network-alert').style.display = 'block';
                return false;
            } else {
                document.getElementById('network-alert').style.display = 'none';
                return true;
            }
        }
        return false;
    }

    async function switchNetwork() {
        try {
            await window.ethereum.request({
                method: 'wallet_switchEthereumChain',
                params: [{ chainId: POLYGON_CHAIN_ID }],
            });
        } catch (e) {
            if (e.code === 4902) {
                alert("Por favor añade la red Polygon a tu MetaMask.");
            }
        }
    }

    // 2. CONEXIÓN Y BALANCE
    async function connect() {
        if (!window.ethereum) return alert("Instala MetaMask");
        const isCorrect = await checkNetwork();
        if (!isCorrect) return switchNetwork();

        provider = new ethers.BrowserProvider(window.ethereum);
        const accounts = await provider.send("eth_requestAccounts", []);
        signer = await provider.getSigner();
        contract = new ethers.Contract(MAIN_CONTRACT, ABI, signer);
        
        document.getElementById('walletAddr').innerText = accounts[0].slice(0,6)+'...'+accounts[0].slice(-4);
        const bal = await provider.getBalance(accounts[0]);
        document.getElementById('userBalance').innerText = `${parseFloat(ethers.formatEther(bal)).toFixed(3)} POL`;
    }

    // 3. ACTUALIZACIÓN DE PRECIOS REALES
    async function updateTicker() {
        try {
            const res = await fetch('https://min-api.cryptocompare.com');
            const json = await res.json();
            const d = json.RAW;
            const fmt = (s, o) => `<span class="ticker-item">${s}: <b>$${o.PRICE.toFixed(2)}</b> <span class="${o.CHANGEPCT24HOUR>=0?'up':'down'}">${o.CHANGEPCT24HOUR.toFixed(2)}%</span></span>`;
            const content = fmt('BTC', d.BTC.USD) + fmt('ETH', d.ETH.USD) + fmt('POL', d.POL.USD);
            document.getElementById('master-ticker').innerHTML = `<div class="flex animate-scroll">${content}${content}</div>`;
        } catch(e) { console.log("API offline"); }
    }

    // 4. ACCIONES DE BOTONES
    async function listNFTAction() {
        if (!await checkNetwork()) return switchNetwork();
        if (!contract) return alert("Conecta tu terminal 🔌");
        const nft = document.getElementById('nftAddr').value;
        const id = document.getElementById('tokenId').value;
        const pr = document.getElementById('price').value;
        try {
            const fee = await contract.listingFee();
            const tx = await contract.listNFT(nft, id, ethers.parseEther(pr), "0x0000000000000000000000000000000000000000", { value: fee });
            await tx.wait();
            alert("¡Activo publicado!");
        } catch (e) { alert("Error en transacción."); }
    }

    async function buyVipAction() {
        if (!await checkNetwork()) return switchNetwork();
        if (!signer) return alert("Conecta tu wallet");
        try {
            const tx = await signer.sendTransaction({ to: MAIN_CONTRACT, value: ethers.parseEther("0.1") });
            await tx.wait();
            alert("¡VIP ACTIVADO!");
        } catch (e) { alert("Error en el pago."); }
    }

    function syncData() { updateTicker(); connect(); }

    // INICIO
    window.addEventListener('load', () => {
        updateTicker();
        setInterval(updateTicker, 60000);
        if (typeof LightweightCharts !== 'undefined') {
            const chart = LightweightCharts.createChart(document.getElementById('chart-container'), {
                layout: { background: { color: 'transparent' }, textColor: '#FFD700' },
                grid: { vertLines: { visible: false }, horzLines: { color: '#222' } }
            });
            const series = chart.addAreaSeries({ lineColor: '#FFD700' });
            series.setData(Array.from({length:30}, (_,i) => ({ time: 1672531200 + (i*3600), value: 0.4 + Math.random()*0.2 })));
        }
        
        // Carrusel de Monstruos
        const car = document.getElementById('nftCarousel');
        let monsters = "";
        for(let i=0; i<15; i++) {
            monsters += `<div class="monster-card glass-3d"><div class="text-4xl">👾</div><div class="orbitron text-[9px] text-yellow-400 mt-2">UNIT #${900+i}</div></div>`;
        }
        car.innerHTML = monsters + monsters;
        
        if (window.ethereum) {
            window.ethereum.on('chainChanged', () => window.location.reload());
        }
    });
</script>
