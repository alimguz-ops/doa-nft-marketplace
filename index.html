<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOA MONSTER — Marketplace Automatizado</title>

    <!-- [MANTENIDO] ANALÍTICA Y MONETIZACIÓN -->
    <script async src="https://pagead2.googlesyndication.com" crossorigin="anonymous"></script>
    <script async src="https://www.googletagmanager.com"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-E14Z7MFKB7');

    <!-- LIBRERÍAS EXTERNAS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com"></script>
    <script src="https://unpkg.com"></script>
    <link href="https://fonts.googleapis.com" rel="stylesheet">

    <style>
        :root { --gold: #FFD700; --neon: #ff00e6; --bg: #050505; }
        body { background: var(--bg); color: #fff; font-family: 'Rajdhani', sans-serif; margin: 0; padding-bottom: 60px; overflow-x: hidden; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(15,15,15,0.95); backdrop-filter: blur(10px); border: 1px solid #222; border-radius: 12px; }

        /* BARRA INFERIOR UNIFICADA */
        .footer-status-bar {
            position: fixed !important;
            bottom: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 40px !important;
            background: #000 !important;
            border-top: 1px solid #1a1a1a !important;
            display: flex !important;
            align-items: center !important;
            padding: 0 20px !important;
            z-index: 999999 !important;
        }
        .status-dot {
            height: 8px; width: 8px; background: #00ff00; border-radius: 50%;
            box-shadow: 0 0 10px #00ff00; animation: pulse-glow 1.5s infinite; margin-right: 12px;
        }
        .ticker-container { flex: 1; overflow: hidden; white-space: nowrap; }
        .ticker-wrapper { display: inline-block; animation: ticker-scroll 35s linear infinite; }
        .ticker-item { display: inline-block; padding: 0 35px; font-size: 10px; font-family: 'Orbitron'; font-weight: bold; color: #555; }
        .footer-val { color: var(--gold); margin-left: 5px; }
        .up { color: #00ff88 !important; } .down { color: #ff4444 !important; }

        @keyframes ticker-scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        @keyframes pulse-glow { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        
        /* BOTONES Y CARDS */
        .btn-main { background: var(--gold); color: #000; font-family: 'Orbitron'; font-size: 0.75rem; font-weight: bold; padding: 12px; border-radius: 6px; cursor: pointer; transition: 0.3s; border: none; width: 100%; }
        .btn-main:hover { filter: brightness(1.2); transform: scale(1.02); }
        input { background: #0a0a0a !important; border: 1px solid #222 !important; color: var(--gold) !important; padding: 10px; border-radius: 6px; outline: none; width: 100%; }
    </style>
</head>
<body>

<main class="p-4 md:p-10 max-w-6xl mx-auto">
    <!-- HEADER -->
    <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
        <div>
            <h1 class="orbitron text-3xl font-bold text-yellow-400 tracking-widest">DOA MONSTER</h1>
            <p class="text-[9px] tracking-[0.4em] text-gray-500 uppercase">Automated NFT Platform</p>
        </div>
        <div class="glass px-6 py-2 flex items-center gap-6">
            <div class="text-right">
                <div id="walletAddr" class="orbitron text-[10px] text-yellow-600">0x...Desconectado</div>
                <div id="userBalance" class="font-bold text-xs">0.00 POL</div>
            </div>
            <button onclick="connect()" class="bg-yellow-400 text-black px-4 py-1.5 rounded-full font-bold orbitron text-[9px] hover:bg-white transition-all">CONECTAR</button>
        </div>
    </header>

    <!-- GRÁFICO -->
    <div class="glass p-4 mb-8">
        <div id="chart-container" class="w-full h-[220px]"></div>
    </div>

    <!-- ACCIONES -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-12">
        <div class="glass p-6">
            <h3 class="orbitron text-[11px] text-yellow-500 mb-6 uppercase">🚀 Publicar NFT</h3>
            <div class="space-y-3">
                <input type="text" id="nftAddr" placeholder="Contrato 0x...">
                <input type="number" id="tokenId" placeholder="Token ID">
                <input type="text" id="price" placeholder="Precio en POL">
                <button onclick="listNFTAction()" class="btn-main uppercase">Publicar Ahora</button>
            </div>
        </div>
        <div class="glass p-6 border-l-4 border-pink-600 flex flex-col justify-between">
            <div>
                <h3 class="orbitron text-[11px] text-pink-500 mb-2 uppercase">💎 Membresía VIP</h3>
                <p class="text-[11px] text-gray-400">Acceso total y comisiones 0%. <br><span class="text-yellow-500 font-bold">0.1 POL / Mensual</span></p>
            </div>
            <button onclick="buyVipAction()" class="btn-main !bg-pink-600 !text-white mt-4 uppercase">Activar VIP</button>
        </div>
    </div>
</main>

<!-- BARRA DE ESTADO INFERIOR (HTML INTEGRADO) -->
<div class="footer-status-bar">
    <div class="status-dot"></div>
    <div style="color: #00ff00; font-size: 10px; font-weight: bold; font-family: 'Orbitron'; margin-right: 15px;">LIVE</div>
    <div class="ticker-container">
        <div id="master-ticker" class="ticker-wrapper">
            <span class="ticker-item uppercase">Sincronizando Terminal DOA 2026...</span>
        </div>
    </div>
    <div style="color:#222; font-size:10px; font-family:'Orbitron'; padding-left:15px; border-left: 1px solid #111; font-weight: bold;">PRO v2.6</div>
</div>

<script>
    const MAIN_CONTRACT = "0x4C1372aB4197116d34e7e43489A8c4412FD74694";
    const INFURA_ID = "3702e6360508431a9c9f2bf02450db30";
    const POLYGON_RPC = `https://polygon-mainnet.infura.io{INFURA_ID}`;
    let provider, signer, account;

    // CONEXIÓN WALLET
    async function connect() {
        if(window.ethereum) {
            try {
                provider = new ethers.BrowserProvider(window.ethereum);
                const accounts = await provider.send("eth_requestAccounts", []);
                signer = await provider.getSigner();
                account = accounts[0];
                document.getElementById('walletAddr').innerText = account.slice(0,6)+'...'+account.slice(-4);
                const bal = await provider.getBalance(account);
                document.getElementById('userBalance').innerText = `${parseFloat(ethers.formatEther(bal)).toFixed(3)} POL`;
            } catch(e) { console.error(e); }
        }
    }

    // TICKER DE PRECIOS REALES
    async function updateTicker() {
        try {
            const res = await fetch(`https://min-api.cryptocompare.com`);
            const json = await res.json();
            const data = json.RAW;
            const container = document.getElementById('master-ticker');
            
            const format = (name, obj) => {
                const p = obj.CHANGEPCT24HOUR;
                const colorClass = p >= 0 ? 'up' : 'down';
                return `<span class="ticker-item">${name}: <span class="footer-val">$${obj.PRICE.toLocaleString()}</span> <span class="${colorClass}">${p>=0?'▲':'▼'}${Math.abs(p).toFixed(2)}%</span></span>`;
            };

            const content = format('BTC', data.BTC.USD) + format('ETH', data.ETH.USD) + format('POL', data.POL.USD) + 
                            `<span class="ticker-item uppercase">⛽ GAS: <span class="footer-val">42.8 GWEI</span></span>`;
            
            container.innerHTML = content + content;
        } catch(e) { console.log("Ticker Error"); }
    }

    // GRÁFICO INICIAL
    function initChart() {
        const chart = LightweightCharts.createChart(document.getElementById('chart-container'), {
            layout: { background: { color: 'transparent' }, textColor: '#FFD700', fontFamily: 'Orbitron' },
            grid: { vertLines: { color: '#111' }, horzLines: { color: '#111' } },
            timeScale: { visible: false }
        });
        const series = chart.addAreaSeries({ lineColor: '#FFD700', topColor: 'rgba(255,215,0,0.1)', bottomColor: 'transparent' });
        series.setData(Array.from({length:60}, (_,i) => ({ time: Math.floor(Date.now()/1000)-(60-i)*3600, value: 0.8+Math.random()*0.2 })));
        chart.timeScale().fitContent();
    }

    // ACCIONES CONTRATO
    async function listNFTAction() {
        if(!signer) return alert("Conecta Wallet");
        try {
            const abi = ["function listNFT(address,uint256,uint256) public"];
            const contract = new ethers.Contract(MAIN_CONTRACT, abi, signer);
            const tx = await contract.listNFT(document.getElementById('nftAddr').value, document.getElementById('tokenId').value, ethers.parseEther(document.getElementById('price').value));
            alert("Listado enviado!");
        } catch(e) { alert("Error en transacción"); }
    }

    async function buyVipAction() {
        if(!signer) return alert("Conecta Wallet");
        try {
            await signer.sendTransaction({ to: MAIN_CONTRACT, value: ethers.parseEther("0.1") });
            alert("Pago VIP enviado!");
        } catch(e) { alert("Error en pago"); }
    }

    document.addEventListener('DOMContentLoaded', () => {
        initChart();
        updateTicker();
        setInterval(updateTicker, 30000);
    });
</script>
